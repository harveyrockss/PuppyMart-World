<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PuppyMart World 3D (preview)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;z-index:5;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:700}
#top{top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.pill,.btn{background:rgba(20,30,50,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:7px 12px;color:#fff;font:700 14px system-ui;text-shadow:none}
.btn{cursor:pointer}.btn:active{transform:scale(.95)}
#right{top:10px;right:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#fps{bottom:8px;right:10px;font-size:11px;opacity:.7}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#2a3a4a;padding:10px 18px;border-radius:16px;font:700 15px system-ui;opacity:0;transition:opacity .3s;z-index:6;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);text-align:center}
#joy{position:fixed;left:22px;bottom:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:5;touch-action:none;display:none}
#joyk{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 2px 8px rgba(0,0,0,.3)}
@media(pointer:coarse){#joy{display:block}#help{display:none}}
#help{bottom:10px;left:10px;font-size:12px;opacity:.85}
a.btn{text-decoration:none;display:inline-block}
#load{position:fixed;inset:0;background:linear-gradient(#59aef0,#cfe8f5);display:flex;align-items:center;justify-content:center;color:#fff;font:800 22px system-ui;z-index:20;transition:opacity .6s}
</style></head><body>
<div id="load">🐶 Loading island…</div>
<div class="hud" id="top"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🐾 <span id="found">0 / 3</span></div><a class="btn" href="./index.html">⬅ 2D game</a></div>
<div class="hud" id="right"><div class="btn" id="btnTime">☀️ Day</div><div class="btn" id="btnLook">👤 Look</div><div class="btn" id="btnQ">⚙ Med</div></div>
<div class="hud" id="help">WASD / arrows move · Shift run · drag = look · click = walk · T time · L look</div>
<div class="hud" id="fps"></div><div id="toast"></div>
<div id="joy"><div id="joyk"></div></div>
<script type="module" src="./world3d.bundle.js"></script>
<script>addEventListener('load',()=>setTimeout(()=>{var l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),700)},400))</script>
</body></html>
