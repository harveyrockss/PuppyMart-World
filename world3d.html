<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PuppyMart World 3D (preview)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.hud{position:fixed;z-index:5;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:700}
#top{top:10px;left:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.pill,.btn{background:rgba(20,30,50,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:7px 12px;color:#fff;font:700 14px system-ui;text-shadow:none}
.btn{cursor:pointer}.btn:active{transform:scale(.95)}
#right{top:10px;right:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#cam{right:10px;bottom:34px;display:flex;gap:8px}#cam .btn{width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;touch-action:none}
#fps{bottom:8px;right:10px;font-size:11px;opacity:.7}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#2a3a4a;padding:10px 18px;border-radius:16px;font:700 15px system-ui;opacity:0;transition:opacity .3s;z-index:6;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25);text-align:center}
#joy{position:fixed;left:22px;bottom:26px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:5;touch-action:none;display:none}
#joyk{position:absolute;left:43px;top:43px;width:54px;height:54px;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.65);box-shadow:0 2px 8px rgba(0,0,0,.3)}
@media(pointer:coarse){#joy{display:block}#help{display:none}}
#help{bottom:10px;left:10px;font-size:12px;opacity:.85}
a.btn{text-decoration:none;display:inline-block}
#load{position:fixed;inset:0;background:linear-gradient(#59aef0,#cfe8f5);display:flex;align-items:center;justify-content:center;color:#fff;font:800 22px system-ui;z-index:20;transition:opacity .6s}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:15;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(3px)}
#modal .panel{background:#fff;color:#2a3a4a;border-radius:22px;padding:18px;max-width:640px;width:100%;max-height:86vh;overflow:auto;font:600 14px system-ui;touch-action:pan-y}
#modal h2{margin:0 0 10px}#modal h2 small{opacity:.55;font-size:14px}
#modal .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.dst{border:2px solid #dde6f0;background:#f6f9fd;border-radius:16px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;color:inherit}.dst:active{transform:scale(.97)}.dst.cur{border-color:#ff8fb8;background:#fff2f8}.dst .fl{font-size:26px}.dst small{opacity:.65;font-weight:500}.dst i{font-style:normal;color:#e0709a}
.dx{margin:8px 0;padding:8px 10px;background:#f6f9fd;border-radius:12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.dx b{flex:100%}.dx span{opacity:.5}.dx span.got{opacity:1;color:#2a7a4a}.dx em{font-style:normal;font-size:11px;opacity:.6}
.x{margin-top:12px;width:100%;padding:10px;border:0;border-radius:14px;background:#ff8fb8;color:#fff;font:800 15px system-ui;cursor:pointer}
#act{position:fixed;right:14px;bottom:92px;width:88px;height:88px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#ffd6e8,#f08cb5);color:#fff;font:800 16px system-ui;z-index:16;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;touch-action:none;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#act.catch{animation:pul .8s infinite;background:radial-gradient(circle at 35% 30%,#fff3a8,#ffb23d)}@keyframes pul{50%{transform:scale(1.12);box-shadow:0 0 0 10px rgba(255,200,80,.35)}}
#cbar{position:relative;height:34px;background:#e8eef6;border-radius:17px;margin:14px 6px}#czone{position:absolute;top:0;bottom:0;background:#6fd48a;border-radius:17px}#cmark{position:absolute;top:-5px;bottom:-5px;width:9px;margin-left:-4px;background:#ff5a8a;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
@media(pointer:coarse){#act{bottom:176px}#cam{bottom:20px}}
#cpor{animation:dbob .55s ease-in-out infinite alternate}#cpor.hop{animation:dhop .5s ease-out}@keyframes dbob{to{transform:translateY(-5px)}}@keyframes dhop{0%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-4deg)}100%{transform:translateY(0)}}
</style></head><body>
<div id="load">🐶 Loading island…</div>
<div class="hud" id="top"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🐾 <span id="found">0</span></div><a class="btn" href="./index.html">⬅ 2D game</a><div class="pill" id="place"></div><div class="pill" id="hidp">🌿 0 hiding</div></div>
<div class="hud" id="cam"><div class="btn" id="rotL">⟲</div><div class="btn" id="rotR">⟳</div><div class="btn" id="zIn">＋</div><div class="btn" id="zOut">－</div></div>
<div class="hud" id="right"><div class="btn" id="btnTravel">🌍 Travel</div><div class="btn" id="btnDex">📖 Dex</div><div class="btn" id="btnTime">☀️ Day</div><div class="btn" id="btnLook">👤 Look</div><div class="btn" id="btnQ">⚙ Med</div></div>
<div class="hud" id="help">Hold or click = walk there · Space/F = Act · WASD / arrows · Shift run · right-drag or ⟲⟳ / Q E = turn · wheel = zoom · T time · L look</div>
<div class="hud" id="fps"></div><button id="act">✋ Act</button><div id="modal"></div><div id="toast"></div>
<div id="joy"><div id="joyk"></div></div>
<script type="module" src="./world3d.bundle.js"></script>
<script>addEventListener('load',()=>setTimeout(()=>{var l=document.getElementById('load');l.style.opacity=0;setTimeout(()=>l.remove(),700)},400))</script>
</body></html>
