<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2b3a;font-family:ui-rounded,'Nunito',system-ui,sans-serif;color:#4a3550;touch-action:none}
canvas#c{display:block;width:100vw;height:100vh}
button{font-family:inherit}
.pill{background:rgba(255,248,238,.93);border-radius:999px;padding:5px 12px;font-weight:700;font-size:15px;box-shadow:0 3px 10px rgba(80,40,90,.25);border:2px solid #fff;white-space:nowrap}
#hud{position:fixed;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:70vw}
#info{position:fixed;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#side{position:fixed;left:10px;top:58px;display:flex;flex-direction:column;gap:8px}
.rb{width:50px;height:50px;border-radius:50%;border:3px solid #fff;background:linear-gradient(#fff3fa,#ffd0e6);font-size:23px;box-shadow:0 4px 12px rgba(90,30,80,.35);cursor:pointer;padding:0}
.rb:active{transform:scale(.92)}
.rb.on{background:linear-gradient(#ffe9a6,#ffc54d)}
#joy{position:fixed;left:20px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.65);z-index:6;touch-action:none;display:none}#joyk{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none}@media(pointer:coarse){#joy{display:block}}#act{position:fixed;right:18px;bottom:22px;width:84px;height:84px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#ffd6e8,#f08cb5);color:#fff;font:700 17px ui-rounded,system-ui;box-shadow:0 6px 16px rgba(90,30,80,.45);text-shadow:0 1px 3px rgba(120,30,80,.5)}
#act:active{transform:scale(.93)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;z-index:5}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
#bar{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:none;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 110px);background:rgba(255,248,238,.95);border-radius:20px;padding:8px;border:3px solid #fff;box-shadow:0 6px 20px rgba(60,30,80,.35)}
#bar button{border:2px solid #f0d8e6;background:#fff;border-radius:12px;padding:5px 9px;font-weight:700;font-size:14px;cursor:pointer;color:#4a3550}
#bar button.sel{background:#ffe9a6;border-color:#ffc54d}
#bar .hc{width:26px;height:26px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#modal{position:fixed;inset:0;background:rgba(60,30,90,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#mbox{background:#fff8ee;border:4px solid #fff;border-radius:26px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:16px 18px;box-shadow:0 12px 40px rgba(40,10,70,.5);position:relative;touch-action:pan-y}
#mbox h2{margin:0 0 8px;font-size:22px;color:#c4577e}
#mx{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:#f4dce8;font-size:18px;cursor:pointer;color:#8a4a74}
.big{display:block;width:100%;margin-top:8px;border:3px solid #fff;border-radius:16px;padding:10px;font:700 17px ui-rounded,system-ui;color:#fff;background:linear-gradient(#ff9cc4,#e26a9f);box-shadow:0 4px 12px rgba(120,40,100,.35);cursor:pointer}
.big.alt{background:linear-gradient(#9ad0ff,#5f9ee0)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#fff;border-radius:16px;padding:10px;border:2px solid #f3dcea;text-align:center;font-weight:700;cursor:pointer;color:#4a3550}
.card small{display:block;font-weight:500;opacity:.7}
.card.cur{border-color:#ffc54d;background:#fff6d8}
.row{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 10px;margin-bottom:8px;border:2px solid #f3dcea}
.row input[type=text],textarea{font:600 15px ui-rounded,system-ui;border:2px solid #ecd2e2;border-radius:10px;padding:6px 8px;width:100%;color:#4a3550;background:#fffdfb;user-select:text}
textarea{height:70px;resize:none}
.row .meta{flex:1;min-width:0;font-weight:700}.row .meta small{display:block;font-weight:500;opacity:.7}
.mini{border:0;border-radius:10px;padding:6px 10px;font-weight:700;cursor:pointer;background:#e8e0fa;color:#4a3a7a}
.mini.on{background:#ffd35c;color:#6a4400}
.sil{filter:brightness(0) opacity(.35)}
#cbar{position:relative;height:34px;border-radius:17px;background:#e6dcf3;margin:14px 0 6px;overflow:hidden;border:3px solid #fff;box-shadow:inset 0 2px 6px rgba(0,0,0,.15)}
#czone{position:absolute;top:0;bottom:0;background:linear-gradient(#9af0a8,#4cc26f);border-radius:14px}
#cmark{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:#e2406f;border-radius:4px;box-shadow:0 0 6px rgba(226,64,111,.7)}
#title{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#ffe8f3 0%,#c9b6f0 55%,#7f7fc4 100%);display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;text-align:center;padding:14px;z-index:15;overflow:auto}
#title h1{font-size:clamp(34px,8vw,64px);margin:0;color:#fff;text-shadow:0 3px 0 #c4577e,0 6px 18px rgba(90,40,120,.5)}
#title p{max-width:460px;margin:0;font-size:16px;color:#5a3d6e;font-weight:600}
#title input{font:700 20px ui-rounded,system-ui;text-align:center;border:4px solid #fff;border-radius:999px;padding:8px 18px;width:min(280px,80vw);color:#4a3550;user-select:text}
#avs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;width:100%}
#avs canvas{width:100%;height:auto;background:rgba(255,255,255,.55);border:4px solid #fff;border-radius:18px;cursor:pointer}
#avs canvas.sel{background:#fff6c8;border-color:#ffc54d;box-shadow:0 0 0 3px #ffb52e}
#title .go{font:700 22px ui-rounded,system-ui;border:4px solid #fff;border-radius:999px;padding:10px 44px;color:#fff;background:linear-gradient(#ff9cc4,#e26a9f);box-shadow:0 6px 18px rgba(120,40,100,.4);cursor:pointer}
#title small{opacity:.75;font-size:13px;font-weight:600}
#side{flex-wrap:wrap;max-height:calc(100vh - 150px);width:112px;gap:6px}
.rb{width:44px;height:44px;font-size:20px}
#toast{top:100px}
#qt{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:min(290px,42vw);background:rgba(255,248,238,.92);border:3px solid #fff;border-radius:16px;padding:6px 10px 7px;box-shadow:0 3px 10px rgba(80,40,90,.25);pointer-events:none}
#qt .qa{font-weight:700;font-size:12px;color:#c4577e;letter-spacing:.5px}
#qt .qb{height:8px;background:#e6dcf3;border-radius:4px;margin:3px 0 5px;overflow:hidden}
#qt .qb i{display:block;height:100%;background:linear-gradient(90deg,#6fd6ff,#9a8cff);border-radius:4px}
#qt .qc{font-weight:700;font-size:14px}
#qt .qd{font-size:12px;opacity:.75;display:flex;justify-content:space-between}
.eb{position:fixed;width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#d9e6ff);font-size:24px;box-shadow:0 4px 12px rgba(40,50,110,.4);padding:0;cursor:pointer}
.eb:active{transform:scale(.92)}
.stars{color:#f5b400;letter-spacing:1px}
.chip{display:inline-block;background:#f3ecfb;border-radius:10px;padding:2px 7px;margin:2px;font-size:13px;font-weight:700}
.chip.no{background:#ffe0e0;color:#b03a3a}
.card canvas{display:block;margin:0 auto 4px}
</style>
</head>

/* ================= interaction ================= */
function nearest(){
 let best=null,bd=80;
 const tryO=(o,kind,ox,oy,disc)=>{const d=Math.hypot(ox-P.x,oy-P.y)-(disc||0);if(d<bd){bd=d;best={o,kind}}};
 if(sc.kind==='world')sc.bushes.forEach(b=>tryO(b,'bush',b.x,b.y,b.deep&&sc.bf&&sc.bf.st==='land'?35:0));
 else if(sc.kind==='cafe'){tryO(sc.stove,'stove',sc.stove.x,sc.stove.y+60);tryO(sc.pantry,'pantry',sc.pantry.x,sc.pantry.y+60);sc.guests.forEach(g=>tryO(g,'guest',g.x,g.y))}
 else sc.dogs.forEach(o=>tryO(o,'dog',o.x,o.y));
 if(S.comp&&CO.breed&&!best)tryO(CO,'comp',CO.x,CO.y,12);
 return best;
}
function modalOpen(){return $('modal').style.display==='flex'}
function act(){
 if(!started||$('title').style.display!=='none')return;
 if(catchS){tryCatch();return}
 if(modalOpen())return;
 const n=nearest();if(!n)return;P.swing=.3;const k=n.kind;
 if(k==='bush'){const b=n.o;
  if(b.dog)startCatch(b);
  else{b.cool=Math.max(b.cool,12);burst(b.x,b.y-20,['#7fcf7a','#b6ea8c'],8);toast(['Just leaves…','Nothing in here.','A butterfly flutters out!'][Math.floor(Math.random()*3)])}}
 else if(k==='dog'){const d=n.o;d.heart=1.2;burst(d.x,d.y-34,['#ff7aa8','#ffb3cf'],8,1.2);toast(d.name+' wags happily 💕')}
 else if(k==='comp'){burst(CO.x,CO.y-34,['#ff7aa8','#ffb3cf'],8,1.2);toast(CO.name+' nuzzles you 💕');addXP(1)}
 else if(k==='stove')cookModal();
 else if(k==='pantry')pantryModal();
 else if(k==='guest')serve(n.o);
}
function addXP(n){const l0=Math.floor((S.xp||0)/120);S.xp=(S.xp||0)+n;const l1=Math.floor(S.xp/120);if(l1>l0){S.coins+=25*(l1-l0);toast('⭐ Pawlight level '+(l1+1)+'! +25 🪙')}}
function serve(g){
 if(!g.order){toast(g.name+' is enjoying the café 🍽️');return}
 const r=RECIPES[g.order];
 if(!(S.dish[g.order]>0)){toast(g.name+' wants '+r.e+' '+r.n+'. Cook it at the stove!');return}
 S.dish[g.order]--;const rew=dishReward(g.order);S.coins+=rew;addXP(r.s*6);S.st.served=(S.st.served||0)+1;
 g.order=null;g.t=M(18,32);g.heart=1.4;burst(g.x,g.y-50,['#ffd35c','#fff6a8'],14,1.4);toast('Delicious! +'+rew+' 🪙');save();
}
function emote(e){
 if(!started||modalOpen()||!sc)return;P.em={e,t:2.2};S.st.emotes=(S.st.emotes||0)+1;
 if(sc.kind==='visit'&&!sc.waved&&e==='👋'&&Math.hypot(P.x-(sc.w/2-90),P.y-(sc.lm.y+90))<170){sc.waved=1;toast(sc.owner.n+' waves back! +5 XP');addXP(5);save()}
 if(sc.kind==='cafe')sc.guests.forEach(g=>{if(Math.hypot(g.x-P.x,g.y-P.y)<130)g.heart=1.2});
}
function burst(x,y,cols,n=10,up=1){for(let i=0;i<n;i++)parts.push({x,y,vx:M(-60,60),vy:M(-110,-20)*up,l:M(.6,1.1),m:1,c:cols[Math.floor(Math.random()*cols.length)],s:M(2,5)})}

/* ---- catch minigame ---- */
function startCatch(b){
 const B=BREEDS[b.dog],r=B.r;
 catchS={b,id:b.dog,tries:3,pos:0,dir:1,sp:1.0+r*.35,zw:ZONE[r],zs:M(.15,.85-ZONE[r]),done:false};
 $('mc').innerHTML=`<h2>🐾 You found something!</h2><div style="text-align:center"><canvas id="cpor" width="220" height="140" style="max-width:100%"></canvas><div style="font-weight:700">${b.deep?'🦋 The butterfly led you to a ':'A shy '}<b>${esc(B.n)}</b>${b.deep?' hiding deep in the thicket!':' is peeking out…'}</div></div><div id="cbar"><div id="czone"></div><div id="cmark"></div></div><div id="ctry" style="text-align:center;font-size:22px"></div><div id="ctreat" style="text-align:center;margin-top:8px"></div><button class="big" id="cbtn">🕸️ Catch!</button><div style="text-align:center;font-size:13px;opacity:.7;margin-top:6px">Tap Catch when the red marker is in the green zone</div>`;
 $('mx').style.display='none';$('modal').style.display='flex';
 $('czone').style.left=(catchS.zs*100)+'%';$('czone').style.width=(catchS.zw*100)+'%';
 portrait($('cpor'),()=>{ctx.translate(110,120);drawDog(0,0,b.dog,1,0,2.2)});
 $('cbtn').onclick=tryCatch;updTries();
 const tr=$('ctreat'),dl=Object.keys(S.dish).filter(k=>S.dish[k]>0&&RECIPES[k]);
 if(dl.length){tr.innerHTML='<div style="font-size:12px;opacity:.7;margin-bottom:4px">Offer a treat to widen the green zone:</div>'+dl.map(k=>`<button class="mini" data-td="${k}">${RECIPES[k].e} ${'★'.repeat(RECIPES[k].s)} ×${S.dish[k]}</button>`).join(' ');
  tr.querySelectorAll('[data-td]').forEach(bt=>bt.onclick=()=>{if(catchS.treat){toast('The dog already has a treat');return}const k=bt.dataset.td;if(!(S.dish[k]>0))return;S.dish[k]--;catchS.treat=1;S.st.treats=(S.st.treats||0)+1;catchS.zw=Math.min(.6,catchS.zw+.04*RECIPES[k].s);catchS.zs=Math.min(catchS.zs,1-catchS.zw);$('czone').style.width=(catchS.zw*100)+'%';$('czone').style.left=(catchS.zs*100)+'%';tr.innerHTML='🍖 The dog sniffs the treat… the green zone grew!';save()})}
}
function updTries(){$('ctry').textContent='❤️'.repeat(catchS.tries)+'🖤'.repeat(3-catchS.tries)}
function tryCatch(){
 if(!catchS||catchS.done)return;
 const hit=catchS.pos>=catchS.zs&&catchS.pos<=catchS.zs+catchS.zw;
 if(hit){catchS.done=true;caughtDog()}
 else{catchS.tries--;updTries();$('mc').firstChild.textContent=catchS.tries>0?'💨 It wriggled free!':'💨 It ran away!';
  if(catchS.tries<=0){catchS.done=true;const b=catchS.b;b.dog=null;b.deep=false;b.cool=25;setTimeout(()=>{closeModal();toast('The dog bolted into the distance…')},700)}
  else{catchS.zs=M(.1,.9-catchS.zw);$('czone').style.left=(catchS.zs*100)+'%'}}
}
function caughtDog(){
 const {b,id}=catchS,B=BREEDS[id];const deep=!!b.deep;b.dog=null;b.deep=false;b.cool=30;
 const first=!S.caught[id];S.st.catches=(S.st.catches||0)+1;if(deep)S.st.deep=(S.st.deep||0)+1;addXP(10+B.r*10);S.caught[id]=(S.caught[id]||0)+1;
 const name=NAMES[Math.floor(Math.random()*NAMES.length)];
 S.dogs.push({id:++S.uid,breed:id,name,c:B.c,home:false});
 let gain=(COIN[B.r]+(first?30:0))*(deep?2:1),extra=deep?'<div style="color:#3a8fc4;font-weight:700">🦋 Deep hideout find! Coins doubled</div>':'';
 const full=Object.keys(BREEDS).filter(k=>BREEDS[k].c===B.c).every(k=>S.caught[k]);
 if(full&&!S.stamps[B.c]){S.stamps[B.c]=1;gain+=100;extra=`<div style="color:#c4577e;font-weight:700">🛂 ${BIOMES[B.c].n} passport stamp! +100 🪙</div>`}
 S.coins+=gain;save();burst(b.x,b.y-30,['#fff6a8','#ffc2f0','#b5f0ff'],24,1.6);
 $('mc').innerHTML=`<h2 style="text-align:center">🎉 Caught!</h2><div style="text-align:center"><canvas id="cpor" width="220" height="140" style="max-width:100%"></canvas><div style="font-weight:700;font-size:19px">${esc(name)} the ${esc(B.n)}</div><div>${first?'✨ New breed! ':''}+${gain} 🪙</div>${extra}</div><button class="big" id="cok">Yay!</button>`;
 portrait($('cpor'),()=>{ctx.translate(110,120);drawDog(0,0,id,1,time,2.2)});
 $('cok').onclick=()=>{closeModal()};catchS.done=true;
}

/* ---- sharing ---- */
function encode(d){try{return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,n:d.n,a:d.av,x:[(d.acc||{}).hat||'none',(d.acc||{}).hold||'net'],h:d.hc,d:d.decor.map(x=>[x.t,x.x,x.y]),g:d.dogs.map(x=>[x.breed,x.name])}))))}catch(e){return ''}}
function decode(code){
 try{const j=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));if(!j||j.v!==1)return null;
  const decor=(Array.isArray(j.d)?j.d:[]).slice(0,120).filter(x=>Array.isArray(x)&&DECOR[x[0]]&&isFinite(x[1])&&isFinite(x[2])).map(x=>({t:x[0],x:clamp(+x[1],60,1040),y:clamp(+x[2],200,760)}));
  const dogs=(Array.isArray(j.g)?j.g:[]).slice(0,8).filter(x=>Array.isArray(x)&&BREEDS[x[0]]).map(x=>({breed:x[0],name:String(x[1]).slice(0,14)}));
  const ax=Array.isArray(j.x)?j.x:[];const acc={hat:HATS[ax[0]]?ax[0]:'none',hold:HOLDS[ax[1]]?ax[1]:'net'};
  return {n:String(j.n||'Friend').slice(0,14),acc,av:clamp(parseInt(j.a)||0,0,AV.length-1),hc:HCOLS.includes(j.h)?j.h:HCOLS[0],decor,dogs}}catch(e){return null}

 if(edit){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;for(let x=80;x<=sc.w-80;x+=40){ctx.beginPath();ctx.moveTo(x,260);ctx.lineTo(x,sc.h-60);ctx.stroke()}for(let y=280;y<=sc.h-60;y+=40){ctx.beginPath();ctx.moveTo(80,y);ctx.lineTo(sc.w-80,y);ctx.stroke()}}
 if(!modalOpen()&&!edit){const n=nearest();if(n){const o=n.o,lab={bush:o.cool>0?'Search again later':'Search',dog:'Pet',comp:'Pet',stove:'Cook',pantry:'Pantry shop',guest:o.order?'Serve':'Enjoying lunch'}[n.kind];const ox=o.x,oy=o.y-({bush:62,stove:20,pantry:20,guest:150}[n.kind]||80)+Math.sin(time*5)*2;ctx.font='700 14px ui-rounded,system-ui';ctx.textAlign='center';const w=ctx.measureText(lab).width+22;ctx.fillStyle='rgba(255,248,238,.95)';rr(ox-w/2,oy-14,w,26,13);ctx.fill();ctx.fillStyle='#8a4a74';ctx.fillText(lab,ox,oy+5)}}
 parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.3);ctx.fill()});ctx.globalAlpha=1;
 if(sc.kind==='world'&&isForest(BIOMES[sc.id]))drawForestLight(BIOMES[sc.id]);
 lightsAndTint();
 ctx.restore();
 const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(80,30,100,0)');vg.addColorStop(1,'rgba(80,30,110,.25)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function lightsAndTint(){
 const dk=darkAmt();if(dk<=.02)return;const vw=W/zoom,vh=H/zoom;
 ctx.globalCompositeOperation='lighter';
 const glow=(x,y,r,c)=>{const g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)};
 if(sc.flies)sc.flies.forEach(f=>{if(f.x<cam.x-20||f.x>cam.x+vw+20||f.y<cam.y-20||f.y>cam.y+vh+20)return;const a=dk*(.5+.5*Math.sin(time*3+f.p*5));glow(f.x,f.y,14,`rgba(${sc.id==='dr'?'160,255,230':'230,255,140'},${a})`)});
 if(sc.kind==='home'||sc.kind==='visit'){glow(sc.w/2,sc.lm.y+8,130,`rgba(255,200,110,${.5*dk})`);sc.decor.forEach(d=>{if(d.t==='lamp')glow(d.x,d.y-50,95,`rgba(255,225,140,${.55*dk})`)})}
 ctx.globalCompositeOperation='multiply';
 const dr=sc.id==='dr';const r=Math.round(lerp(255,dr?120:95,dk)),g=Math.round(lerp(255,dr?105:100,dk)),b=Math.round(lerp(255,dr?205:165,dk));
 ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(cam.x,cam.y,vw,vh);ctx.globalCompositeOperation='source-over';
}

 const h=`<div class="pill">🪙 ${S.coins}</div><div class="pill">🐕 ${S.dogs.length}</div>${nd?`<div class="pill">🍽️ ${nd}</div>`:''}`;
 const place=sc.kind==='world'?BIOMES[sc.id].f+' '+BIOMES[sc.id].n:sc.kind==='home'?'🏠 My Home':sc.kind==='cafe'?'🍳 Pawsome Café':'👋 '+sc.owner.n+"'s Home";
 const hid=sc.kind==='world'?`<div class="pill">🌿 ${sc.bushes.filter(b=>b.dog&&!b.deep).length} hiding</div>`:'';
 const dkk=darkAmt()>.55;const inf=`<div class="pill">${esc(place)}</div>${sc.kind==='cafe'?'':`<div class="pill">${dkk?'🌙 Night':'☀️ Day'}</div>`}${hid}`;
 const aq=QUESTS.find(q=>!S.qdone[q.id]);let qh='';if(aq){const [c,m]=aq.g();qh=`<div class="qa">🐾 PAWLIGHT Lv ${lvl()}</div><div class="qb"><i style="width:${((S.xp||0)%120)/1.2}%"></i></div><div class="qc">${esc(aq.t)}</div><div class="qd"><span>${esc(aq.d)}</span><span>${Math.min(c,m)}/${m}</span></div>`}else qh=`<div class="qa">🐾 PAWLIGHT Lv ${lvl()}</div><div class="qb"><i style="width:${((S.xp||0)%120)/1.2}%"></i></div><div class="qc">All quests complete! ⭐</div>`;
 if(qh!==lastQ){lastQ=qh;$('qt').innerHTML=qh}
 if(h+inf!==lastHud){lastHud=h+inf;$('hud').innerHTML=h;$('info').innerHTML=inf}
}

function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(started)update(dt);else time+=dt;render();updateHud();requestAnimationFrame(loop)}

 const box=$('avs');box.innerHTML='';const cs=[];
 AV.forEach((a,i)=>{const c=document.createElement('canvas');c.width=100;c.height=130;if(i===pick)c.className='sel';c.title=a.n;

}

  for(let v=0;v<3;v++)warmQ.push(()=>bushSpr(B,v));setTimeout(warmRun,30)}catch(e){window.__preErr=String(e&&e.stack||e);preW=null}window.__pre=performance.now()-t0}
